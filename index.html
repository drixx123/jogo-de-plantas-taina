<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>⚡ Vedita Battle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <!-- TOPO -->

        <header class="top">

            <div class="logo">
                ⚡ VEDITA BATTLE
            </div>

            <div class="level">
                NÍVEL
                <strong id="level">1</strong>
            </div>

            <div class="score">
                PONTOS
                <strong id="score">0</strong>
            </div>

        </header>


        <!-- STATUS -->

        <section class="status">

            <div class="status-box">

                <div class="status-title">
                    🥋 VEDITA
                </div>

                <div class="bar-label">
                    Vida
                </div>

                <div class="bar">
                    <div
                        id="playerHealth"
                        class="health"
                    ></div>
                </div>

                <div class="bar-label">
                    Energia
                </div>

                <div class="bar energy-bar">
                    <div
                        id="playerEnergy"
                        class="energy"
                    ></div>
                </div>

            </div>


            <div class="battle-info">

                <span id="enemyCounter">
                    INIMIGOS: 3
                </span>

                <span id="wave">
                    ONDA 1
                </span>

            </div>

        </section>


        <!-- ÁREA DO JOGO -->

        <main
            id="gameArea"
            class="game-area"
        >

            <!-- EFEITO DO FUNDO -->

            <div class="stars"></div>


            <!-- JOGADOR -->

            <div
                id="player"
                class="player"
            >

                <div class="hair"></div>

                <div class="head">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                </div>

                <div class="body"></div>

                <div class="arm left-arm"></div>
                <div class="arm right-arm"></div>

                <div class="leg left-leg"></div>
                <div class="leg right-leg"></div>

                <div class="aura"></div>

            </div>


            <!-- INIMIGOS -->

            <div id="enemies"></div>


            <!-- PROJÉTIL -->

            <div
                id="projectile"
                class="projectile hidden"
            >
                <div class="beam-core"></div>
            </div>


            <!-- MENSAGEM -->

            <div
                id="message"
                class="message"
            >
                PREPARE-SE!
            </div>


            <!-- GAME OVER -->

            <div
                id="gameOver"
                class="overlay hidden"
            >

                <div class="result-box">

                    <div class="result-icon">
                        💀
                    </div>

                    <h2>
                        DERROTA
                    </h2>

                    <p>
                        Os esqueletinhos venceram!
                    </p>

                    <p>
                        Pontuação:
                        <strong id="finalScore">
                            0
                        </strong>
                    </p>

                    <button
                        id="restartButton"
                        class="restart"
                    >
                        🔄 JOGAR NOVAMENTE
                    </button>

                </div>

            </div>


            <!-- VITÓRIA -->

            <div
                id="victory"
                class="overlay hidden"
            >

                <div class="result-box victory-box">

                    <div class="result-icon">
                        🏆
                    </div>

                    <h2>
                        VITÓRIA!
                    </h2>

                    <p>
                        Você derrotou todos os inimigos!
                    </p>

                    <p>
                        Pontuação:
                        <strong id="victoryScore">
                            0
                        </strong>
                    </p>

                    <button
                        id="nextLevelButton"
                        class="restart"
                    >
                        ⚡ PRÓXIMO NÍVEL
                    </button>

                </div>

            </div>

        </main>


        <!-- CONTROLES -->

        <section class="controls">

            <button
                id="moveLeft"
                class="control"
            >
                ◀
            </button>

            <button
                id="attackButton"
                class="attack"
            >
                👊 ATAQUE
            </button>

            <button
                id="kamehamehaButton"
                class="kamehameha"
            >
                ⚡ KAMEHAMEHA
            </button>

            <button
                id="moveRight"
                class="control"
            >
                ▶
            </button>

        </section>


        <!-- INSTRUÇÕES -->

        <section class="instructions">

            <p>
                ⌨️
                <strong>A / ←</strong>
                mover para esquerda
            </p>

            <p>
                ⌨️
                <strong>D / →</strong>
                mover para direita
            </p>

            <p>
                👊
                <strong>Espaço</strong>
                ataque
            </p>

            <p>
                ⚡
                <strong>K</strong>
                Kamehameha
            </p>

        </section>

    </div>


    <script src="script.js"></script>

</body>
</html>

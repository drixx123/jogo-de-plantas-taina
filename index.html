<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VEDITA ⚡ BATTLE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game-wrapper">

    <!-- ================= HEADER ================= -->

    <header class="hud">

        <div class="brand">
            <span>⚡</span>
            VEDITA
            <small>BATTLE</small>
        </div>

        <div class="hud-item">
            <span>NÍVEL</span>
            <strong id="level">1</strong>
        </div>

        <div class="hud-item">
            <span>PONTOS</span>
            <strong id="score">0</strong>
        </div>

        <div class="hud-item combo-box">
            <span>COMBO</span>
            <strong id="combo">0</strong>
        </div>

    </header>


    <!-- ================= STATUS ================= -->

    <section class="status-panel">

        <div class="player-status">

            <div class="name">
                🥋 VEDITA
            </div>

            <div class="bar-title">
                VIDA
            </div>

            <div class="bar">
                <div
                    id="healthBar"
                    class="health-fill">
                </div>
            </div>

            <div class="bar-title">
                ENERGIA
            </div>

            <div class="bar energy-bar">
                <div
                    id="energyBar"
                    class="energy-fill">
                </div>
            </div>

        </div>

        <div class="wave">
            <span>ONDA</span>
            <strong id="wave">1</strong>
        </div>

        <div class="enemy-count">
            <span>INIMIGOS</span>
            <strong id="enemyCount">0</strong>
        </div>

    </section>


    <!-- ================= GAME ================= -->

    <main id="game" class="game-area">

        <div class="sky"></div>

        <div class="moon"></div>

        <div class="mountain mountain-one"></div>
        <div class="mountain mountain-two"></div>

        <div class="stars"></div>

        <div class="ground"></div>


        <!-- PLAYER -->

        <div
            id="player"
            class="player">

            <div class="player-aura"></div>

            <div class="hair"></div>

            <div class="head">
                <span class="eye eye-left"></span>
                <span class="eye eye-right"></span>
            </div>

            <div class="body"></div>

            <div class="arm arm-left"></div>
            <div class="arm arm-right"></div>

            <div class="leg leg-left"></div>
            <div class="leg leg-right"></div>

        </div>


        <!-- ENEMIES -->

        <div id="enemies"></div>


        <!-- KAMEHAMEHA -->

        <div
            id="beam"
            class="beam hidden">

            <div class="beam-core"></div>

        </div>


        <!-- PARTICLES -->

        <div id="particles"></div>


        <!-- COMBO TEXT -->

        <div
            id="comboText"
            class="combo-text">
        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message">
            PREPARE-SE!
        </div>


        <!-- ================= GAME OVER ================= -->

        <div
            id="gameOver"
            class="screen hidden">

            <div class="result-card">

                <div class="result-icon">
                    💀
                </div>

                <h1>DERROTA</h1>

                <p>
                    Os esqueletinhos venceram!
                </p>

                <div class="final-score">
                    PONTOS:
                    <strong id="finalScore">
                        0
                    </strong>
                </div>

                <button
                    id="restartButton"
                    class="main-button">

                    🔄 JOGAR NOVAMENTE

                </button>

            </div>

        </div>


        <!-- ================= VICTORY ================= -->

        <div
            id="victory"
            class="screen hidden">

            <div class="result-card victory-card">

                <div class="result-icon">
                    🏆
                </div>

                <h1>VITÓRIA!</h1>

                <p>
                    Você derrotou todos os inimigos!
                </p>

                <div class="final-score">
                    PONTOS:
                    <strong id="victoryScore">
                        0
                    </strong>
                </div>

                <button
                    id="nextLevelButton"
                    class="main-button">

                    ⚡ PRÓXIMO NÍVEL

                </button>

            </div>

        </div>

    </main>


    <!-- ================= CONTROLS ================= -->

    <section class="controls">

        <button
            id="leftButton"
            class="control-button">

            ◀

        </button>

        <button
            id="attackButton"
            class="attack-button">

            👊 ATAQUE

        </button>

        <button
            id="beamButton"
            class="beam-button">

            ⚡ KAMEHAMEHA

        </button>

        <button
            id="rightButton"
            class="control-button">

            ▶

        </button>

    </section>


    <!-- ================= HELP ================= -->

    <footer class="help">

        <span>
            A / ← Mover
        </span>

        <span>
            ESPAÇO Ataque
        </span>

        <span>
            K Kamehameha
        </span>

        <span>
            D / → Mover
        </span>

    </footer>

</div>


<script src="script.js"></script>

</body>
</html>
